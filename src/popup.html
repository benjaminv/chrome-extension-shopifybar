<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; margin: 0; width: 280px; background: #1a1a1a; color: #eee; }
    .pad { padding: 12px; }
    .banner { padding: 8px 12px; color: #fff; font-weight: 700; font-size: 12px; }
    .banner.live { background: #108043; }
    .banner.preview { background: #c05717; }
    .banner.inactive { background: #444; color: #bbb; font-weight: 400; }
    h1 { font-size: 12px; margin: 0 0 2px; }
    .meta { color: #aaa; margin: 0 0 10px; word-break: break-all; }
    .status { color: #aaa; margin: 0 0 10px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    button.act { flex: 1 1 45%; background: #333; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 8px; font-size: 11px; cursor: pointer; }
    button.act:hover { background: #3d3d3d; }
    button.act.on { background: #0b5cad; border-color: #0b5cad; color: #fff; }
    .modes { display: flex; gap: 4px; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid #333; }
    .modes span { color: #888; margin-right: 4px; }
    .modes button { background: none; border: 1px solid #444; color: #aaa; border-radius: 5px; padding: 3px 7px; font-size: 10px; cursor: pointer; }
    .modes button.on { border-color: #0b5cad; color: #fff; background: #0b5cad; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="banner" class="banner inactive">Checking this tab...</div>
  <div id="main" class="pad hidden">
    <h1 id="themeName"></h1>
    <p id="themeMeta" class="meta"></p>
    <p id="barStatus" class="status"></p>
    <div class="row">
      <button id="btnSessionHide" class="act"></button>
      <button id="btnPersistentHide" class="act"></button>
    </div>
    <div class="row">
      <button id="btnForceShow" class="act" title="Brings Shopify's preview bar back (reloads with preview_theme_id and pb=1). Use when Shopify's own hide has kept it away.">Restore bar</button>
      <button id="btnCopy" class="act">Copy preview link</button>
      <button id="btnEditor" class="act">Open theme editor</button>
    </div>
    <div class="modes">
      <span>On-page badge:</span>
      <button data-mode="full">full</button>
      <button data-mode="dot">dot</button>
      <button data-mode="off">off</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
